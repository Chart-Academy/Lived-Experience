<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d">
<title id="t">A community practitioner meeting with a client</title>
<desc id="d">Illustration of a practitioner with a laptop and a client seated across a table, with a map pin and resource icons above them.</desc>
<rect width="640" height="360" fill="#EEF2FA"/>
<circle cx="560" cy="70" r="120" fill="#DDE5F4"/>
<rect x="0" y="300" width="640" height="60" fill="#D5DDEE"/>
<!-- window -->
<rect x="60" y="50" width="150" height="110" rx="6" fill="#fff" stroke="#3A56A6" stroke-width="4"/>
<line x1="135" y1="50" x2="135" y2="160" stroke="#3A56A6" stroke-width="4"/>
<line x1="60" y1="105" x2="210" y2="105" stroke="#3A56A6" stroke-width="4"/>
<!-- resource bubbles -->
<g transform="translate(300 40)">
  <path d="M40 0a40 40 0 0 1 40 40c0 30-40 70-40 70S0 70 0 40A40 40 0 0 1 40 0z" fill="#D71F2D"/>
  <circle cx="40" cy="40" r="16" fill="#fff"/>
</g>
<g fill="#fff" stroke="#3A56A6" stroke-width="3">
  <rect x="410" y="60" width="54" height="40" rx="8"/>
  <rect x="230" y="70" width="54" height="40" rx="8"/>
</g>
<path d="M425 88l10-12 10 12m-17-2v10h14V86" fill="none" stroke="#D71F2D" stroke-width="3" stroke-linejoin="round"/>
<path d="M245 90h24M257 78v24" stroke="#D71F2D" stroke-width="4" stroke-linecap="round"/>
<!-- table -->
<rect x="170" y="230" width="300" height="16" rx="4" fill="#1F2A44"/>
<rect x="190" y="246" width="12" height="60" fill="#1F2A44"/><rect x="438" y="246" width="12" height="60" fill="#1F2A44"/>
<!-- practitioner (left) -->
<circle cx="200" cy="150" r="26" fill="#8D5A3B"/>
<path d="M174 146c0-22 14-34 28-34s26 12 26 30c-8-10-30-10-54 4z" fill="#2B1B14"/>
<path d="M150 232c0-44 22-60 50-60s50 16 50 60z" fill="#3A56A6"/>
<rect x="190" y="174" width="20" height="40" fill="#fff" opacity=".9"/>
<rect x="194" y="186" width="12" height="16" rx="2" fill="#D71F2D"/>
<!-- laptop -->
<path d="M250 230l12-40h62l-10 40z" fill="#5A6378"/>
<rect x="244" y="228" width="84" height="5" rx="2" fill="#5A6378"/>
<!-- client (right) -->
<circle cx="440" cy="150" r="26" fill="#C99A72"/>
<path d="M414 150c-4-26 12-40 28-40s30 12 26 40c-6-14-14-20-26-20s-22 6-28 20z" fill="#5A3A22"/>
<path d="M390 232c0-44 22-60 50-60s50 16 50 60z" fill="#D71F2D"/>
<!-- papers -->
<rect x="356" y="214" width="46" height="16" rx="2" fill="#fff" stroke="#3A56A6" stroke-width="2"/>
<!-- speech bubble -->
<g transform="translate(470 104)">
  <rect width="96" height="44" rx="12" fill="#fff" stroke="#3A56A6" stroke-width="3"/>
  <path d="M14 44l-6 16 20-16" fill="#fff" stroke="#3A56A6" stroke-width="3" stroke-linejoin="round"/>
  <path d="M20 22l10 10 22-20" fill="none" stroke="#3A56A6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>
