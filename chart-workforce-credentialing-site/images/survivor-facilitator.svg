<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d">
<title id="t">A women's workforce readiness circle</title>
<desc id="d">Illustration of five women seated in a supportive circle, one leading the group with a flip chart showing an upward path.</desc>
<rect width="640" height="360" fill="#FBEFF0"/>
<circle cx="90" cy="70" r="110" fill="#F6DDE0"/>
<rect x="0" y="292" width="640" height="68" fill="#F1D3D7"/>
<!-- flip chart -->
<rect x="470" y="60" width="120" height="100" rx="4" fill="#fff" stroke="#1F2A44" stroke-width="4"/>
<line x1="530" y1="160" x2="510" y2="230" stroke="#1F2A44" stroke-width="4"/><line x1="530" y1="160" x2="550" y2="230" stroke="#1F2A44" stroke-width="4"/>
<rect x="488" y="122" width="16" height="24" fill="#5C5450"/><rect x="510" y="108" width="16" height="38" fill="#3A56A6"/>
<rect x="532" y="94" width="16" height="52" fill="#3F6B50"/><rect x="554" y="78" width="16" height="68" fill="#D71F2D"/>
<!-- plant -->
<rect x="40" y="248" width="34" height="44" rx="4" fill="#3A56A6"/>
<path d="M57 248c-20-30-6-56 0-60 6 4 20 30 0 60zM57 250c-30-6-36-28-34-34 8-2 30 6 34 34zM57 250c30-6 36-28 34-34-8-2-30 6-34 34z" fill="#3F6B50"/>
<!-- rug -->
<ellipse cx="300" cy="300" rx="220" ry="30" fill="#E7BFC5"/>
<!-- helper to draw seated woman: head, hair, body -->
<!-- woman 1 (back left) -->
<g transform="translate(170 150)">
  <path d="M-40 110c0-50 18-70 40-70s40 20 40 70z" fill="#3A56A6"/>
  <circle cx="0" cy="18" r="22" fill="#6B3E26"/>
  <path d="M-24 14c0-26 14-34 24-34s26 10 24 34c-4-12-18-18-24-18s-20 6-24 18z" fill="#1E1410"/>
  <circle cx="-22" cy="20" r="10" fill="#1E1410"/><circle cx="22" cy="20" r="10" fill="#1E1410"/>
</g>
<!-- woman 2 (back center) -->
<g transform="translate(300 130)">
  <path d="M-40 120c0-52 18-72 40-72s40 20 40 72z" fill="#D71F2D"/>
  <circle cx="0" cy="22" r="22" fill="#C99A72"/>
  <path d="M-26 30c-4-36 10-46 26-46s30 10 26 46c-2-20-12-28-26-28s-24 8-26 28z" fill="#7A4A2A"/>
</g>
<!-- woman 3 (back right) -->
<g transform="translate(420 150)">
  <path d="M-40 110c0-50 18-70 40-70s40 20 40 70z" fill="#3F6B50"/>
  <circle cx="0" cy="18" r="22" fill="#8D5A3B"/>
  <path d="M-24 12c0-24 12-32 24-32s24 8 24 32c-6-8-16-12-24-12s-18 4-24 12z" fill="#D71F2D"/>
</g>
<!-- woman 4 (front left) -->
<g transform="translate(220 205)">
  <path d="M-44 100c0-46 20-62 44-62s44 16 44 62z" fill="#5C5450"/>
  <circle cx="0" cy="14" r="23" fill="#E2B48C"/>
  <path d="M-25 12c-2-26 12-36 25-36s28 10 25 36c-6-14-14-18-25-18s-19 4-25 18z" fill="#2B1B14"/>
  <path d="M-25 12c-6 16-6 30 2 40" stroke="#2B1B14" stroke-width="8" fill="none" stroke-linecap="round"/>
</g>
<!-- woman 5 (front right, facilitator gesturing) -->
<g transform="translate(375 205)">
  <path d="M-44 100c0-46 20-62 44-62s44 16 44 62z" fill="#1F2A44"/>
  <path d="M30 60l50-30" stroke="#1F2A44" stroke-width="14" stroke-linecap="round"/>
  <circle cx="84" cy="28" r="9" fill="#5A3A22"/>
  <circle cx="0" cy="14" r="23" fill="#5A3A22"/>
  <path d="M-24 6c2-24 14-30 24-30s24 6 24 30c-8-10-16-12-24-12s-16 2-24 12z" fill="#111"/>
  <circle cx="0" cy="-22" r="13" fill="#111"/>
</g>
<!-- hearts / connection -->
<path d="M300 92c-6-10-22-6-20 6 2 10 20 20 20 20s18-10 20-20c2-12-14-16-20-6z" fill="#D71F2D" opacity=".85"/>
</svg>
